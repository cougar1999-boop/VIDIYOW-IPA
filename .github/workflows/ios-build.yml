name: Build iOS App

on:
  push:
    branches: [ main, master ] # Start de build zodra je naar main of master pusht
  workflow_dispatch: # Hierdoor kun je de build ook handmatig starten via de GitHub website

jobs:
  build-ios:
    runs-on: macos-14 # Start een virtuele Mac met Xcode 15+
    
    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: CocoaPods installeren (indien aanwezig)
        run: |
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "Geen Podfile gevonden, CocoaPods stap overgeslagen."
          fi

      - name: Voer buildscript uit
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Build Artifact naar GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VIDIYOW-iOS-Build
          path: build/export/
          if-no-files-found: error
